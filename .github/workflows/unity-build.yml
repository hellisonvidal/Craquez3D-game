name: Unity Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      UNITY_VERSION: 6000.0.6f1
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Cache Library folder
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Build and test using Unity Docker image
      - name: Build and Test
        uses: docker://unityci/editor:${{ env.UNITY_VERSION }}-base-1
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -runTests \
              -testPlatform editmode \
              -testResults ${{ github.workspace }}/artifacts/editmode/results.xml \
              -logFile - \
              -quit

      - name: Run Play Mode Tests
        uses: docker://unityci/editor:${{ env.UNITY_VERSION }}-base-1
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -runTests \
              -testPlatform playmode \
              -testResults ${{ github.workspace }}/artifacts/playmode/results.xml \
              -logFile - \
              -quit

      # Build for Windows Standalone
      - name: Build Windows
        uses: docker://unityci/editor:${{ env.UNITY_VERSION }}-base-1
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -buildTarget StandaloneWindows64 \
              -buildPath ${{ github.workspace }}/build/Windows \
              -customBuildName Craquez3D \
              -logFile - \
              -quit

      # Build for Linux Standalone
      - name: Build Linux
        uses: docker://unityci/editor:${{ env.UNITY_VERSION }}-base-1
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -buildTarget StandaloneLinux64 \
              -buildPath ${{ github.workspace }}/build/Linux \
              -customBuildName Craquez3D \
              -logFile - \
              -quit

      # Upload build artifacts
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-Windows
          path: build/Windows/
          retention-days: 7

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-Linux
          path: build/Linux/
          retention-days: 7

      # Upload test results
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: artifacts/
          retention-days: 7

  # Release workflow (triggered on version tags)
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: Craquez3D-Windows
          path: release/Windows

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: Craquez3D-Linux
          path: release/Linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/Windows/*
            release/Linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}