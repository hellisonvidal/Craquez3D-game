# Compila o projeto para Linux e Windows (verificação de build).
# Usa o mesmo game-ci/unity-builder do workflow Android, que lê a versão do Unity
# em ProjectSettings/ProjectVersion.txt e ativa a licença pelos segredos
# UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD.
# A Release (APK) continua sendo publicada pelo workflow "Android: build e Release".
name: Unity Build

# Não roda em push na main para não disputar a licença Unity com o workflow Android.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        targetPlatform: [StandaloneLinux64, StandaloneWindows64]
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - name: Build (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: Craquez3D
          versioning: None

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 7
