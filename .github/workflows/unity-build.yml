name: Unity Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      UNITY_VERSION: 6000.0.86f1
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      # Use workspace as HOME (writable location)
      UNITY_HOME: ${{ github.workspace }}/.unity_home
      UNITY_CACHE_DIR: ${{ github.workspace }}/.cache/unity3d
      UNITY_CONFIG_DIR: ${{ github.workspace }}/.config/unity3d
      UNITY_LOCAL_DIR: ${{ github.workspace }}/.local/share/unity3d

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Cache Library folder
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Setup Unity environment (create writable directories)
      - name: Setup Unity Environment
        run: |
          mkdir -p ${{ env.UNITY_LOCAL_DIR }}
          mkdir -p ${{ env.UNITY_CACHE_DIR }}
          mkdir -p ${{ env.UNITY_CONFIG_DIR }}
          mkdir -p ${{ github.workspace }}/artifacts/editmode
          mkdir -p ${{ github.workspace }}/artifacts/playmode
          mkdir -p ${{ github.workspace }}/build/Linux

      # Debug: Verify Unity environment and license
      - name: Debug Unity Startup
        uses: docker://unityci/editor:ubuntu-6000.0.86f1-base-3
        env:
          HOME: ${{ env.UNITY_HOME }}
          XDG_CACHE_HOME: ${{ env.UNITY_CACHE_DIR }}
          XDG_CONFIG_HOME: ${{ env.UNITY_CONFIG_DIR }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          args: |
            echo "=== Unity Environment Debug ==="
            echo "HOME=$HOME"
            echo "XDG_CACHE_HOME=$XDG_CACHE_HOME"
            echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
            echo "UNITY_HOME=$UNITY_HOME"
            echo "UNITY_CACHE_DIR=$UNITY_CACHE_DIR"
            echo "UNITY_CONFIG_DIR=$UNITY_CONFIG_DIR"
            echo "UNITY_LICENSE length: ${#UNITY_LICENSE}"
            echo "=== Directory Permissions ==="
            ls -la $HOME
            ls -la $XDG_CACHE_HOME
            ls -la $XDG_CONFIG_HOME
            echo "=== Unity Version ==="
            /opt/unity/Editor/Unity -version
            echo "=== License Test (no project) ==="
            /opt/unity/Editor/Unity -batchmode -nographics -quit
            echo "=== License Test (with project) ==="
            /opt/unity/Editor/Unity -batchmode -nographics -projectPath ${{ github.workspace }} -quit
            echo "=== Debug Complete ==="

      # Build and test using Unity Docker image (Ubuntu base)
      - name: Run EditMode Tests
        uses: docker://unityci/editor:ubuntu-6000.0.86f1-base-3
        env:
          HOME: ${{ env.UNITY_HOME }}
          XDG_CACHE_HOME: ${{ env.UNITY_CACHE_DIR }}
          XDG_CONFIG_HOME: ${{ env.UNITY_CONFIG_DIR }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -runTests \
              -testPlatform editmode \
              -testResults ${{ github.workspace }}/artifacts/editmode/results.xml \
              -logFile - \
              -quit

      - name: Run Play Mode Tests
        uses: docker://unityci/editor:ubuntu-6000.0.86f1-base-3
        env:
          HOME: ${{ env.UNITY_HOME }}
          XDG_CACHE_HOME: ${{ env.UNITY_CACHE_DIR }}
          XDG_CONFIG_HOME: ${{ env.UNITY_CONFIG_DIR }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -runTests \
              -testPlatform playmode \
              -testResults ${{ github.workspace }}/artifacts/playmode/results.xml \
              -logFile - \
              -quit

      # Build for Linux Standalone
      - name: Build Linux
        uses: docker://unityci/editor:ubuntu-6000.0.86f1-base-3
        env:
          HOME: ${{ env.UNITY_HOME }}
          XDG_CACHE_HOME: ${{ env.UNITY_CACHE_DIR }}
          XDG_CONFIG_HOME: ${{ env.UNITY_CONFIG_DIR }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -buildTarget StandaloneLinux64 \
              -buildPath ${{ github.workspace }}/build/Linux \
              -customBuildName Craquez3D \
              -logFile - \
              -quit

      # Upload Linux build artifact
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-Linux
          path: build/Linux/
          retention-days: 7

      # Upload test results
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: artifacts/
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      UNITY_VERSION: 6000.0.86f1
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Cache Library folder
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Install Unity using official installer (no game-ci actions)
      - name: Download Unity Installer
        run: |
          $unityVersion = "${{ env.UNITY_VERSION }}"
          $url = "https://download.unity3d.com/download_unity/${{ env.UNITY_VERSION }}/Windows64EditorInstaller/UnitySetup64-${{ env.UNITY_VERSION }}.exe"
          $output = "UnitySetup.exe"
          Write-Host "Downloading Unity from $url"
          Invoke-WebRequest -Uri $url -OutFile $output

      - name: Install Unity
        run: |
          $unityVersion = "${{ env.UNITY_VERSION }}"
          $installPath = "C:\Program Files\Unity\Hub\Editor\${{ env.UNITY_VERSION }}"
          $arguments = "/S /D=$installPath"
          Write-Host "Installing Unity to $installPath"
          Start-Process -FilePath "UnitySetup.exe" -ArgumentList $arguments -Wait -NoNewWindow

      # Verify Unity Installation
      - name: Verify Unity Installation
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\${{ env.UNITY_VERSION }}\Editor\Unity.exe"
          if (Test-Path $unityExe) {
            & $unityExe -version
          } else {
            Write-Error "Unity not found at $unityExe"
            exit 1
          }

      # Activate Unity License
      - name: Activate Unity License
        if: env.UNITY_LICENSE != ''
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\${{ env.UNITY_VERSION }}\Editor\Unity.exe"
          $licenseFile = "${{ runner.temp }}\unity_license.ulf"
          Set-Content -Path $licenseFile -Value "${{ secrets.UNITY_LICENSE }}"
          & $unityExe -batchmode -nographics -username "CI" -password "CI" -serial "${{ secrets.UNITY_LICENSE }}" -logFile - -quit
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unity license activation failed"
            exit 1
          }

      # Build for Windows Standalone (native Windows runner, no Docker)
      - name: Build Windows
        run: |
          $unityExe = "C:\Program Files\Unity\Hub\Editor\${{ env.UNITY_VERSION }}\Editor\Unity.exe"
          & $unityExe `
            -batchmode `
            -nographics `
            -projectPath ${{ github.workspace }} `
            -buildTarget StandaloneWindows64 `
            -buildPath ${{ github.workspace }}\build\Windows `
            -customBuildName Craquez3D `
            -logFile - `
            -quit

      # Upload Windows build artifact
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-Windows
          path: build/Windows/
          retention-days: 7

  # Release workflow (triggered on version tags)
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: Craquez3D-Windows
          path: release/Windows

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: Craquez3D-Linux
          path: release/Linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/Windows/*
            release/Linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}