name: Unity Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      UNITY_VERSION: 6000.0.86f1
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Cache Library folder
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Setup Unity environment (fix HOME/cache directories)
      - name: Setup Unity Environment
        run: |
          mkdir -p /github/home/.local/share/unity3d
          mkdir -p /github/home/.cache/unity3d
          mkdir -p /github/home/.config/unity3d
          mkdir -p ${{ github.workspace }}/artifacts/editmode
          mkdir -p ${{ github.workspace }}/artifacts/playmode
          mkdir -p ${{ github.workspace }}/build/Linux

      # Build and test using Unity Docker image (Ubuntu base)
      - name: Run EditMode Tests
        uses: docker://unityci/editor:ubuntu-6000.0.86f1-base-3
        env:
          HOME: /github/home
          XDG_CACHE_HOME: /github/home/.cache
          XDG_CONFIG_HOME: /github/home/.config
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -runTests \
              -testPlatform editmode \
              -testResults ${{ github.workspace }}/artifacts/editmode/results.xml \
              -logFile - \
              -quit

      - name: Run Play Mode Tests
        uses: docker://unityci/editor:ubuntu-6000.0.86f1-base-3
        env:
          HOME: /github/home
          XDG_CACHE_HOME: /github/home/.cache
          XDG_CONFIG_HOME: /github/home/.config
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -runTests \
              -testPlatform playmode \
              -testResults ${{ github.workspace }}/artifacts/playmode/results.xml \
              -logFile - \
              -quit

      # Build for Linux Standalone
      - name: Build Linux
        uses: docker://unityci/editor:ubuntu-6000.0.86f1-base-3
        env:
          HOME: /github/home
          XDG_CACHE_HOME: /github/home/.cache
          XDG_CONFIG_HOME: /github/home/.config
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          args: |
            /opt/unity/Editor/Unity \
              -batchmode \
              -nographics \
              -projectPath ${{ github.workspace }} \
              -buildTarget StandaloneLinux64 \
              -buildPath ${{ github.workspace }}/build/Linux \
              -customBuildName Craquez3D \
              -logFile - \
              -quit

      # Upload Linux build artifact
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-Linux
          path: build/Linux/
          retention-days: 7

      # Upload test results
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: artifacts/
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      UNITY_VERSION: 6000.0.86f1
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # Cache Library folder
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Install Unity on Windows runner
      - name: Install Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}

      # Activate Unity license (if available)
      - name: Activate Unity
        if: env.UNITY_LICENSE != ''
        uses: game-ci/unity-activate@v4
        with:
          license: ${{ env.UNITY_LICENSE }}

      # Build for Windows Standalone (native Windows runner, no Docker)
      - name: Build Windows
        run: |
          & "C:\Program Files\Unity\Hub\Editor\${{ env.UNITY_VERSION }}\Editor\Unity.exe" \
            -batchmode \
            -nographics \
            -projectPath ${{ github.workspace }} \
            -buildTarget StandaloneWindows64 \
            -buildPath ${{ github.workspace }}\build\Windows \
            -customBuildName Craquez3D \
            -logFile - \
            -quit

      # Upload Windows build artifact
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-Windows
          path: build/Windows/
          retention-days: 7

  # Release workflow (triggered on version tags)
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: Craquez3D-Windows
          path: release/Windows

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: Craquez3D-Linux
          path: release/Linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/Windows/*
            release/Linux/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}