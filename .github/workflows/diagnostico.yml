# Diagnóstico das animações: aplica cada clipe nos personagens com o retarget Humanoid da própria Unity
# e salva as posições das articulações (artefato "Diagnostico"). Rodar em Actions -> Run workflow.
name: "Diagnóstico de animação"

on:
  workflow_dispatch:

jobs:
  poses:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Diag-v2-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Diag-v2-
      - name: Unity (diagnóstico)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: Craquez.EditorTools.CraquezDiag.Run
          versioning: None
      - name: Mostrar resultado no log
        if: always()
        run: |
          echo "POSES_INICIO"
          cat Diagnostico/poses.json || true
          echo "POSES_FIM"
      - name: Guardar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico
          path: Diagnostico
          if-no-files-found: warn

  partida:
    # Build Linux e uma partida jogada sozinha (-autoteste): lista no log todo erro/exceção da partida.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-v2-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Linux-v2-
      - name: Unity (build Linux de teste)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: Craquez.EditorTools.CraquezCI.BuildLinuxTeste
          versioning: None
      - name: Jogar a partida automática
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri >/dev/null
          sudo chown -R "$USER" Build || true
          chmod +x Build/Linux/Craquez3D.x86_64
          set +e
          # log pelo stdout: com -logFile arquivo o player não chegava a criá-lo e o passo só via o timeout
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" Build/Linux/Craquez3D.x86_64 -autoteste -force-glcore -screen-width 1280 -screen-height 720 -logFile - > partida.log 2>&1
          echo "codigo de saida: $?"
          grep -E "AUTOTESTE|Exception|NullReference|IndexOutOfRange|MissingReference" partida.log | head -200
          echo "--- fim do log ---"; tail -40 partida.log
          exit 0
      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Partida
          path: |
            partida.log
            autoteste_*.png
          if-no-files-found: warn
