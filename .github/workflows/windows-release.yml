# Gera o build Windows na nuvem e publica uma Release no GitHub.
# - Automático: a cada push na main que altere o arquivo VERSION.
# - Manual: aba Actions -> "Windows: build e Release" -> Run workflow (qualquer branch).
# A Release (tag vX.Y.Z + ZIP do build) é o que o atualizador dentro do app baixa.
# Roda em Linux: a Unity gera o build Windows (Mono) a partir da imagem windows-mono do game-ci,
# que funciona com a licença Personal (o runner windows-latest exigiria serial Pro e PowerShell).
name: "Windows: build e Release"

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar Release (se desmarcado, só gera o build como artefato)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Conferir segredos
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          faltando=""
          for s in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            [ -z "${!s}" ] && faltando="$faltando $s"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Faltam segredos em Settings > Secrets and variables > Actions:$faltando (veja o README, seção 'Build automático no GitHub')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Ler versão
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::VERSION inválido: '$V' (use X.Y.Z)"; exit 1; fi
          IFS=. read -r MA MI PA <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"
          # pula só se a Release já tiver o arquivo desta plataforma (Android e Windows dividem a mesma Release)
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.zip$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A Release v$V já tem o arquivo .zip. O build será gerado só como artefato; aumente o arquivo VERSION para publicar outra."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Windows-

      - name: Build Windows (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: Craquez3D
          buildMethod: Craquez.EditorTools.CraquezCI.BuildWindows
          versioning: Custom
          version: ${{ steps.v.outputs.version }}

      - name: Compactar build Windows
        id: zip
        run: |
          EXE=$(sudo find build -name 'Craquez3D.exe' | head -n1)
          if [ -z "$EXE" ]; then echo "::error::Build Windows não encontrado"; exit 1; fi
          BUILD_DIR=$(dirname "$EXE")
          sudo chown -R "$(id -u):$(id -g)" build
          # não vai para o jogador: símbolos de depuração gerados pela Unity
          rm -rf "$BUILD_DIR"/*_BurstDebugInformation_DoNotShip "$BUILD_DIR"/*_BackUpThisFolder_ButDontShipItWithYourGame
          mkdir -p saida
          ZIP="$PWD/saida/Craquez3D-v${{ steps.v.outputs.version }}-windows.zip"
          (cd "$BUILD_DIR" && zip -qr "$ZIP" .)
          ls -lh saida
          echo "file=saida/Craquez3D-v${{ steps.v.outputs.version }}-windows.zip" >> "$GITHUB_OUTPUT"

      - name: Guardar build (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: Craquez3D-v${{ steps.v.outputs.version }}-windows
          path: ${{ steps.zip.outputs.file }}
          retention-days: 30

      - name: Publicar Release
        if: steps.v.outputs.exists == 'false' && (github.event_name == 'push' || inputs.publicar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          # notas = seção da versão no CHANGELOG.md
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Craquez 3D v$V" > notas.md
          # cria a Release ou, se o outro workflow já criou, só anexa o arquivo
          if ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "v$V" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Craquez 3D v$V" \
              --notes-file notas.md \
              --latest || true
          fi
          gh release upload "v$V" "${{ steps.zip.outputs.file }}" --repo "$GITHUB_REPOSITORY" --clobber
