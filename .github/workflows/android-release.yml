# Gera os APKs Android (celular e TV) na nuvem e publica uma Release no GitHub.
# - Automático: a cada push na main que altere o arquivo VERSION.
# - Manual: aba Actions -> "Android: build e Release" -> Run workflow (qualquer branch).
# A Release (tag vX.Y.Z + Craquez3D-vX.Y.Z.apk + Craquez3D-TV-vX.Y.Z.apk) é o que o atualizador dentro do app baixa.
name: "Android: build e Release"

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar Release (se desmarcado, só gera os APKs como artefatos)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  android:
    name: "Android (${{ matrix.nome }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Celular
            prefixo: Craquez3D
            tv: false
          # versão para TV (Google TV / Android TV 4K, ex.: TCL C6K): pacote próprio (com.craquez.craquez3d.tv),
          # 32 e 64 bits (ARMv7 + ARM64), banner de TV e escala de resolução 4K
          - nome: TV
            prefixo: Craquez3D-TV
            tv: true
    steps:
      - name: Conferir segredos
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          faltando=""
          for s in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            [ -z "${!s}" ] && faltando="$faltando $s"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Faltam segredos em Settings > Secrets and variables > Actions:$faltando (veja o README, seção 'Build automático no GitHub')."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Ler versão
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::VERSION inválido: '$V' (use X.Y.Z)"; exit 1; fi
          IFS=. read -r MA MI PA <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000 + MI*100 + PA))" >> "$GITHUB_OUTPUT"
          ARQ="${{ matrix.prefixo }}-v$V.apk"
          # pula só se a Release já tiver este arquivo específico (Celular, TV e Windows dividem a mesma Release)
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ARQ"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A Release v$V já tem o arquivo $ARQ. O APK será gerado só como artefato; aumente o arquivo VERSION para publicar outra."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      # só cache com a chave exata: restaurar a Library de uma versão anterior fazia a Unity ser morta
      # (exit 137) ao recarregar os scripts em alguns builds (v1.1.4, v1.5.0)
      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ matrix.prefixo }}-v2-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Configurar variante TV
        if: matrix.tv
        run: |
          mkdir -p Assets/Craquez/Resources
          echo tv > Assets/Craquez/Resources/flavor.txt

      - name: Build Android (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          allowDirtyBuild: ${{ matrix.tv }}
          targetPlatform: Android
          buildName: ${{ matrix.prefixo }}
          buildMethod: Craquez.EditorTools.CraquezCI.BuildAndroid
          versioning: Custom
          version: ${{ steps.v.outputs.version }}
          androidVersionCode: ${{ steps.v.outputs.code }}
          androidExportType: androidPackage
          androidKeystoreName: craquez.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Separar APK
        id: apk
        run: |
          APK=$(sudo find build -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "::error::Nenhum APK gerado"; exit 1; fi
          mkdir -p saida
          ARQ="${{ matrix.prefixo }}-v${{ steps.v.outputs.version }}.apk"
          sudo cp "$APK" "saida/$ARQ"
          sudo chown -R "$(id -u):$(id -g)" saida
          echo "file=saida/$ARQ" >> "$GITHUB_OUTPUT"
          ls -lh saida

      - name: Guardar APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefixo }}-v${{ steps.v.outputs.version }}-android
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publicar Release
        if: steps.v.outputs.exists == 'false' && (github.event_name == 'push' || inputs.publicar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          # notas = seção da versão no CHANGELOG.md
          awk -v v="$V" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Craquez 3D v$V" > notas.md
          # cria a Release ou, se o outro workflow já criou, só anexa o arquivo
          if ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "v$V" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Craquez 3D v$V" \
              --notes-file notas.md \
              --latest || true
          fi
          gh release upload "v$V" "${{ steps.apk.outputs.file }}" --repo "$GITHUB_REPOSITORY" --clobber
